services:
  localstack:
    container_name: localstack
    # Pinned for demonstration only: 4.14.0 is the final LocalStack Community release and no longer
    # receives security updates. Use a current image (requires LOCALSTACK_AUTH_TOKEN) beyond this sample. See README.
    image: localstack/localstack:4.14.0
    read_only: false  # required to write to /tmp
    # Bind to localhost only, so the LocalStack API is not reachable from other machines on the network
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4571:4571"
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"  # required for some AWS services like AWS Lambda
    security_opt:
      - no-new-privileges:true
